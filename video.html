<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hum Living · video</title>
<style>html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; } #p { width: 100%; height: 100%; opacity: .01; } .en-pagina #p { opacity: 1; }</style>
</head>
<body>
<div id="p"></div>
<script>
/* Reproductor de YouTube del Launcher Motica Hum Living para la app de Samsung (Tizen).
 * La app de Samsung corre en file:// y desde ahí YouTube no reproduce (error 153: falta el encabezado Referer). Esta
 * página va en https (GitHub Pages: https://adrianguzman85.github.io/hum-tv/video.html), pone el reproductor y la app
 * la maneja por postMessage:
 *   la app manda   {hum: 1, tipo: 'llamar', metodo: 'loadVideoById' | 'playVideo' | ..., args: [...]}
 *   la página avisa {hum: 1, tipo: 'onReady' | 'onStateChange' | 'onError', data} y cada segundo
 *                   {hum: 1, tipo: 'estado', t, vol, mudo}
 * Solo obedece a la ventana que la contiene y solo métodos de la lista. No lleva datos de ninguna casa.
 * El video inicial va en el hash: video.html#v=<id de YouTube>. Solo ES5: la Samsung de 2018 usa Chromium 56.
 * Fondo transparente: la Samsung dibuja la imagen del video en una capa detrás de la página y un fondo negro la tapa.
 * Sin subtítulos (en la TV salía «[Música]» encima). El reproductor de YouTube va casi invisible (.01, como en Fire TV):
 * su fondo negro y sus controles tapaban la imagen, que la TV dibuja detrás.
 * Excepción, Tizen 6.5 (Samsung AU8000 de 2021, Villa Tuuk H02, 5-nov-2026): ahí el video chico se dibuja dentro de la
 * página, no detrás, y con .01 no se veía; con el reproductor visible (1) se ve en la ventana y a pantalla completa. */
(function () {
  var q = {}, padre = window.parent, yt = null;
  // Tizen 6.0 (AU8000 de Tuuk H03, H04 y H05) tenía el mismo síntoma que la 6.5: solo se oía. Va igual.
  if (/Tizen 6\./.test(navigator.userAgent)) document.documentElement.className = 'en-pagina';
  var PERMITIDOS = { loadVideoById: 1, cueVideoById: 1, playVideo: 1, pauseVideo: 1, stopVideo: 1, setVolume: 1, mute: 1, unMute: 1, seekTo: 1 };
  location.hash.replace(/^#/, '').split('&').forEach(function (par) {
    var i = par.indexOf('=');
    if (i > 0) q[par.slice(0, i)] = decodeURIComponent(par.slice(i + 1));
  });
  function avisar(m) { m.hum = 1; try { padre.postMessage(JSON.stringify(m), '*'); } catch (e) {} }
  function sinSubtitulos() { try { yt.unloadModule('captions'); yt.unloadModule('cc'); } catch (e) {} }

  window.addEventListener('message', function (e) {
    var m;
    if (e.source !== padre || !yt) return;
    try { m = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (x) { return; }
    if (!m || m.hum !== 1 || m.tipo !== 'llamar' || !PERMITIDOS[m.metodo]) return;
    try { yt[m.metodo].apply(yt, m.args || []); } catch (x) {}
  });

  window.onYouTubeIframeAPIReady = function () {
    yt = new YT.Player('p', {
      width: '100%', height: '100%', videoId: q.v || '',
      playerVars: { autoplay: 1, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, modestbranding: 1, rel: 0, playsinline: 1, cc_load_policy: 0 },
      events: {
        onReady: function () { sinSubtitulos(); avisar({ tipo: 'onReady' }); },
        onStateChange: function (e) { if (e.data === 1) sinSubtitulos(); avisar({ tipo: 'onStateChange', data: e.data }); },
        onError: function (e) { avisar({ tipo: 'onError', data: e.data }); }
      }
    });
    setInterval(function () {
      try { avisar({ tipo: 'estado', t: yt.getCurrentTime(), vol: yt.getVolume(), mudo: yt.isMuted() }); } catch (e) {}
    }, 1000);
  };
  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = function () { avisar({ tipo: 'onError', data: -1 }); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
